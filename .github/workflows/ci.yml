name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      # Without a team: sign ad hoc, so the tests can run.
      - name: Test the Mac app
        run: >
          xcodebuild -project AutoCore.xcodeproj -scheme AutoCore
          -destination 'platform=macOS' test
          CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO ENABLE_HARDENED_RUNTIME=NO

      - name: Build the Remote
        run: >
          xcodebuild -project AutoCore.xcodeproj -scheme AutoCoreRemote
          -destination 'generic/platform=iOS' build CODE_SIGNING_ALLOWED=NO
