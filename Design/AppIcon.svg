<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- AutoCore app icon: a mirrored iPhone and a tap. Render with rsvg-convert. -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C2028"/>
      <stop offset="1" stop-color="#0B0C10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.48" r="0.62">
      <stop offset="0" stop-color="#22C7C2" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22C7C2" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="glyph" x1="360" y1="260" x2="680" y2="770" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4BE8D6"/>
      <stop offset="0.5" stop-color="#24B9CB"/>
      <stop offset="1" stop-color="#2F86EA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <g id="phone">
      <rect x="372" y="262" width="280" height="500" rx="58" fill="none" stroke-width="30"/>
      <rect x="474" y="296" width="76" height="20" rx="10" stroke="none"/>
      <circle cx="512" cy="540" r="36" stroke="none"/>
      <circle cx="512" cy="540" r="80" fill="none" stroke-width="20" opacity="0.7"/>
      <circle cx="512" cy="540" r="118" fill="none" stroke-width="14" opacity="0.35"/>
    </g>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="url(#edge)" stroke-width="3"/>
  </g>
  <g transform="translate(0 0)">
    <use href="#phone" fill="#22C7C2" stroke="#22C7C2" opacity="0.35" filter="url(#blur)"/>
    <use href="#phone" fill="url(#glyph)" stroke="url(#glyph)"/>
  </g>
</svg>
